name: Release to PyPI

# Publishes python/ to PyPI when a v* tag is pushed.
#
# Uses Trusted Publishing (OIDC), so there is no API token in this repo
# and nothing to rotate or leak: PyPI verifies the workflow identity
# directly. That requires a one-time setup on pypi.org that cannot be
# automated from here -- see RELEASING.md.
#
# Tests run again before the build. CI has almost certainly already run
# them on the commit being tagged, but "almost certainly" is not what you
# want standing between a typo and an immutable PyPI release.

on:
  push:
    tags:
      - 'v*'

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install
        run: python -m pip install --upgrade pip build twine && pip install -e "python[dev]"

      - name: Lint
        run: ruff check python/

      - name: Run tests
        run: pytest python/ -q

      # A wheel whose bundled spec differs from the site's would ship a
      # package documented by a page that describes something else.
      - name: Check the tool spec is in sync
        run: node scripts/sync-spec.js --check

      # PyPI is append-only: 0.1.0 can never be re-uploaded. Catching a
      # tag/version mismatch here is the difference between fixing a typo
      # and burning a version number.
      #
      # The alias is checked in the same breath. thl.lab pins
      # thehallucinatedlab==<version>, so a drifted alias would publish a
      # package that cannot resolve at all -- and that is also unfixable
      # once uploaded.
      - name: Check the tag matches both package versions
        run: |
          python - "$GITHUB_REF_NAME" <<'PY'
          import pathlib, re, sys, tomllib

          tag = sys.argv[1].removeprefix("v")
          load = lambda p: tomllib.loads(pathlib.Path(p).read_text())["project"]
          real = load("python/pyproject.toml")
          alias = load("alias/pyproject.toml")

          pin = None
          for dep in alias["dependencies"]:
              m = re.fullmatch(r"thehallucinatedlab==(\S+)", dep)
              if m:
                  pin = m.group(1)

          errors = []
          if tag != real["version"]:
              errors.append(f"tag {sys.argv[1]} does not match package version {real['version']}")
          if alias["version"] != real["version"]:
              errors.append(f"alias version {alias['version']} != package version {real['version']}")
          if pin != real["version"]:
              errors.append(f"alias pins thehallucinatedlab=={pin}, expected =={real['version']}")

          for e in errors:
              print(f"::error::{e}")
          sys.exit(1) if errors else print(f"releasing {real['version']} (thehallucinatedlab + thl.lab)")
          PY

      # Kept in separate directories because the publish job uploads them
      # in two steps: one trusted-publisher exchange per project, so a
      # rejection names which project was rejected.
      - name: Build sdist and wheel
        run: |
          python -m build python/ --outdir dist/thehallucinatedlab/
          python -m build alias/  --outdir dist/thl-lab/

      - name: Check the metadata renders on PyPI
        run: twine check --strict dist/thehallucinatedlab/* dist/thl-lab/*

      - name: Upload the artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Separate job so the OIDC token is minted only after everything has
    # already passed, and only this job can ever mint one.
    permissions:
      id-token: write

    # Point the PyPI trusted publisher at this environment name. It also
    # gives you a place to add a manual approval gate later.
    environment:
      name: pypi
      url: https://pypi.org/p/thehallucinatedlab

    steps:
      # Same major as upload-artifact above: the two share an artifact
      # format and mixing majors fails at download time.
      - name: Download the artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/

      # Two exchanges rather than one bulk upload. Each project has its own
      # trusted-publisher entry on PyPI, and uploading them separately means
      # a rejection says which one was rejected instead of failing the whole
      # release with one opaque 403.
      - name: Publish thehallucinatedlab
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/thehallucinatedlab/

      # Second, and deliberately so: the alias pins an exact version of the
      # package above, so publishing it first would leave a window in which
      # `pip install thl.lab` resolves to nothing.
      - name: Publish thl.lab
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/thl-lab/
