name: CI

# The site has no build step, so there is nothing to compile — this
# checks the things that can silently rot on a static site: a CSP that
# stops being enforceable, an asset reference that no longer resolves,
# a page that quietly grows past the documented budget.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only. Nothing here needs write access to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and site invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Pinned to a commit SHA rather than a mutable tag, so a compromised
      # or retagged action cannot change what runs here.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm

      # The SITE still ships zero runtime dependencies - nothing in
      # node_modules is served, bundled or referenced by any page. These
      # are dev tools only. `npm ci` installs the lockfile exactly rather
      # than resolving ranges afresh, and --ignore-scripts means no
      # package can run code during install.
      - name: Install dev tooling
        run: npm ci --ignore-scripts

      - name: Check every script parses
        run: |
          set -e
          for f in $(git ls-files '*.js'); do
            case "$f" in assets/vendor/*) continue ;; esac
            node --check "$f"
          done
          echo "all scripts parse"

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: node --test "test/**/*.test.js"

  python:
    name: THL library
    runs-on: ubuntu-latest
    # The EDA suite draws several hundred figures. Ten minutes was right
    # when the package was Pillow and a parser.
    timeout-minutes: 20

    # The site itself stays dependency-free; this job exists only for the
    # pip package under python/, which necessarily has a dependency
    # (Pillow) because encoding images is not something to hand-roll.
    strategy:
      fail-fast: false
      matrix:
        # Floor and ceiling. The versions in between do not fail on their
        # own, and running five of them costs minutes to learn nothing.
        python-version: ['3.10', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # [eda] is installed so its suite actually runs. Those tests skip
      # cleanly without pandas, which is worse than it sounds: several
      # hundred would go quietly unrun and the job would still be green.
      # The RAG extras stay out — torch is gigabytes and their tests skip
      # for the same reason, which is a separate call to make.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e "python[dev,eda,eda-excel]"

      - name: Lint
        run: ruff check python/

      - name: Run tests
        run: pytest python/ -q

      # The wheel carries its own copy of the tool spec. If it ever stops
      # matching spec/manifest.json, the website starts documenting
      # arguments the package does not accept.
      - name: Check the tool spec is in sync
        run: node scripts/sync-spec.js --check

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # The site ships no credentials and has no backend, so this is a
      # tripwire rather than a scanner: it fails the build if a key
      # pattern or a gitignored secret file ever gets committed.
      - name: Look for committed credentials
        run: |
          set -e
          patterns='(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36}|sk-[A-Za-z0-9]{32,}|xox[baprs]-[A-Za-z0-9-]{10,})'
          if git grep -nIE "$patterns" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::possible credential committed — rotate it, do not just delete the commit"
            exit 1
          fi
          if git ls-files | grep -qE '(^|/)\.env$|\.pem$|\.p12$|\.keystore$|(^|/)id_rsa'; then
            echo "::error::a key or env file is tracked by git"
            exit 1
          fi
          echo "no credential patterns found"
