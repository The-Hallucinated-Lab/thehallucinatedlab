[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "thehallucinatedlab"
version = "0.2.0"
description = "The Hallucinated Lab toolkit — local-first tools you can call as ordinary Python methods."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Hallucinated Lab", email = "thehallucinatedlab@gmail.com" }]
keywords = [
  "image", "convert", "png", "jpeg", "webp", "avif", "local-first", "toolkit",
  "eda", "exploratory-data-analysis", "profiling", "pandas", "data-quality",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Utilities",
]
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
# ruff is pinned to a major line, not left open. An unbounded `ruff>=0.6`
# means a release can enable a new lint rule and turn CI red on code nobody
# touched - which is exactly how UP038 landed here.
dev = ["pytest>=8.0", "ruff>=0.6,<0.13"]

# The RAG pipeline, one extra per stage.
#
# The base package depends on Pillow and nothing else, and that is worth
# protecting: `pip install thehallucinatedlab` is ~3MB today and would be
# several gigabytes if torch were a hard dependency. Someone who came for
# `convert` should not pay for an embedding model they will never load.
#
# Every tool imports its dependencies inside the function that needs them
# (see deps.py), so these stay genuinely optional rather than being
# optional in the metadata and mandatory at import time.
#
# `thl serve` is deliberately absent: the bridge is built on stdlib
# http.server, so it needs nothing installed.
extract = [
  "langchain-community>=0.3",
  "langchain-core>=0.3",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-pptx>=0.6",
  "openpyxl>=3.1",
  "beautifulsoup4>=4.12",
  "ebooklib>=0.18",
  "striprtf>=0.0.26",
  "odfpy>=1.4",
]
chunk = [
  "langchain-text-splitters>=0.3",
  "tokenizers>=0.15",
  "tiktoken>=0.7",
]
embed = [
  "sentence-transformers>=3.0",
  "numpy>=1.24",
]
index = [
  "chromadb>=0.5",
  "numpy>=1.24",
]
rag = [
  "thehallucinatedlab[extract,chunk,embed,index]",
]

# Exploratory data analysis. Deliberately not part of [rag]: profiling a
# CSV has nothing to do with the document pipeline, and someone who wants
# one should not install the other.
#
# No seaborn. `thl eda` emits an analysis.py the user is meant to edit,
# and it should be installable from the same four packages named here.
eda = [
  "pandas>=2.0,<4",
  "numpy>=1.24,<3",
  "matplotlib>=3.7,<4",
  "scipy>=1.10,<2",
]
eda-excel = ["openpyxl>=3.1,<4"]
eda-parquet = ["pyarrow>=14,<26"]

[project.scripts]
thl = "thehallucinatedlab.cli:main"

[project.urls]
Homepage = "https://thehallucinatedlab.space"
Documentation = "https://thehallucinatedlab.space/convert.html"
Source = "https://github.com/The-Hallucinated-Lab/thehallucinatedlab"
Issues = "https://github.com/The-Hallucinated-Lab/thehallucinatedlab/issues"

[tool.hatch.build.targets.wheel]
packages = ["thehallucinatedlab"]

[tool.hatch.build.targets.sdist]
include = ["thehallucinatedlab", "tests", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
