[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "thehallucinatedlab"
version = "0.1.0"
description = "The Hallucinated Lab toolkit — local-first tools you can call as ordinary Python methods."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "The Hallucinated Lab", email = "thehallucinatedlab@gmail.com" }]
keywords = ["image", "converter", "png", "jpeg", "webp", "avif", "local-first", "toolkit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Utilities",
]
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
thl = "thehallucinatedlab.cli:main"

[project.urls]
Homepage = "https://thehallucinatedlab.space"
Documentation = "https://thehallucinatedlab.space/image-converter.html"
Source = "https://github.com/The-Hallucinated-Lab/thehallucinatedlab"
Issues = "https://github.com/The-Hallucinated-Lab/thehallucinatedlab/issues"

[tool.hatch.build.targets.wheel]
packages = ["thehallucinatedlab"]

[tool.hatch.build.targets.sdist]
include = ["thehallucinatedlab", "tests", "README.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
